name: One-time dependency lockfile security refresh
on:
  push:
    branches: [fix/cake-galaxy-security-speed-2026-11]
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[lockfile-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve patched dependency versions
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit regenerated lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update secure dependency lockfile [lockfile-sync]"
          git push origin HEAD:fix/cake-galaxy-security-speed-2026-11
