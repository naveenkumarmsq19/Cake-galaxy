name: Cake Galaxy read-only LIVE smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'scripts/qa/live-smoke.mjs'
      - 'scripts/qa/live-interactions.mjs'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install read-only browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test production public pages + API + catalog cover images
        run: node scripts/qa/live-smoke.mjs
      - name: Test safe interactive customer flows and mobile gallery
        if: always()
        run: node scripts/qa/live-interactions.mjs
      - name: Publish audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cakegalaxy-readonly-live-smoke
          path: qa-artifacts/
          if-no-files-found: ignore
