name: Cake Galaxy checks
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability inventory
        run: |
          npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - name: Verify Cloudflare Pages export
        run: CAKE_STATIC_EXPORT=1 npm run build -w @cake-galaxy/web
      - name: Verify search-visible HTML and structured data
        run: npm run check:search-export -w @cake-galaxy/web
