name: Cake Galaxy checks
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability inventory
        run: |
          npm audit --omit=dev --audit-level=high || true
      - run: npm run check
      - name: Verify Cloudflare Pages export
        run: CAKE_STATIC_EXPORT=1 npm run build -w @cake-galaxy/web
